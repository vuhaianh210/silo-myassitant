<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Silo"><meta name="theme-color" id="themeColor" content="#F4F7F5">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="icons/icon-192.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
  <script>try { const choice = localStorage.getItem('silo_theme'); document.documentElement.dataset.theme = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch {}</script>
  <title>Silo — Quản lý chi tiêu</title>
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">Tài chính cá nhân</p><h1>Silo</h1></div><button id="themeButton" class="icon-button" type="button" aria-label="Đổi giao diện" aria-haspopup="dialog">☼</button></header>
  <main id="app" inert>
    <section class="period-nav" aria-label="Chọn kỳ chi tiêu"><button id="previousPeriod" class="icon-button" type="button" aria-label="Kỳ trước">‹</button><button id="periodPicker" class="period-title" type="button" aria-label="Cài đặt kỳ chi tiêu"><strong id="periodLabel">Kỳ tháng</strong><span id="periodRange">—</span></button><button id="nextPeriod" class="icon-button" type="button" aria-label="Kỳ sau">›</button></section>
    <section id="summary" class="summary" aria-labelledby="remainingLabel"><p id="remainingLabel" class="summary-label">Còn lại</p><p id="remainingAmount" class="summary-amount">—</p><p id="periodStatus" class="status-text">Chưa nhập thu nhập kỳ này</p><div class="progress" role="progressbar" aria-label="Mức sử dụng thu nhập" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill"></span></div><dl class="summary-details"><div><dt>Thu nhập</dt><dd><button id="incomeButton" type="button">Nhập thu nhập</button></dd></div><div><dt>Đã dùng</dt><dd id="spentAmount">0&nbsp;₫</dd></div></dl></section>
    <section class="transactions" aria-labelledby="transactionsTitle"><div class="section-heading"><h2 id="transactionsTitle">Khoản chi</h2><button id="manageCategories" type="button">Danh mục</button></div><div id="categoryFilter" class="category-filter" role="toolbar" aria-label="Lọc theo danh mục"></div><div id="expenseList"></div></section>
  </main>
  <button id="addExpense" class="fab" type="button" aria-label="Thêm khoản chi">+</button><p id="appStatus" class="toast" aria-live="polite" aria-atomic="true"></p><section id="storageError" class="fatal-error" role="alert" hidden></section><button id="updateBanner" class="update-banner" type="button" hidden>Có bản cập nhật — Tải lại</button>
  <dialog id="incomeSheet" class="sheet" aria-labelledby="incomeTitle"><form id="incomeForm" novalidate><header><h2 id="incomeTitle">Thu nhập kỳ này</h2><button type="button" data-close="incomeSheet" aria-label="Đóng">×</button></header><label for="incomeAmount">Số tiền</label><div class="money-control"><input id="incomeAmount" name="incomeAmount" type="text" inputmode="numeric" autocomplete="off" aria-describedby="incomeAmountError"><button type="button" data-triple-zero="incomeAmount">000</button><span>₫</span></div><p id="incomeAmountError" class="field-error" role="alert"></p><button class="primary-button" type="submit">Lưu thu nhập</button></form></dialog>
  <dialog id="expenseSheet" class="sheet" aria-labelledby="expenseTitle"><form id="expenseForm" novalidate><header><h2 id="expenseTitle">Thêm khoản chi</h2><button type="button" data-close="expenseSheet" aria-label="Đóng">×</button></header><label for="expenseAmount">Số tiền</label><div class="money-control"><input id="expenseAmount" name="expenseAmount" type="text" inputmode="numeric" autocomplete="off" aria-describedby="expenseAmountError"><button type="button" data-triple-zero="expenseAmount">000</button><span>₫</span></div><p id="expenseAmountError" class="field-error" role="alert"></p><label for="expenseTitleInput">Tiêu đề</label><input id="expenseTitleInput" name="title" maxlength="80" autocomplete="off"><p id="expenseTitleError" class="field-error" role="alert"></p><fieldset><legend>Danh mục</legend><div id="categoryGrid" class="category-grid"></div></fieldset><label for="expenseDate">Ngày</label><input id="expenseDate" name="date" type="date"><p id="expenseDateError" class="field-error" role="alert"></p><button class="primary-button" type="submit">Lưu khoản chi</button></form></dialog>
  <dialog id="periodSettingsSheet" class="sheet" aria-labelledby="periodSettingsTitle"><form id="periodSettingsForm"><header><h2 id="periodSettingsTitle">Cài đặt kỳ</h2><button type="button" data-close="periodSettingsSheet" aria-label="Đóng">×</button></header><label for="cycleStartDay">Ngày bắt đầu kỳ</label><input id="cycleStartDay" type="number" inputmode="numeric" min="1" max="31"><p id="cycleStartDayError" class="field-error" role="alert"></p><button class="primary-button" type="submit">Lưu ngày bắt đầu</button></form></dialog>
  <dialog id="themeSheet" class="sheet" aria-labelledby="themeTitle"><form id="themeForm"><header><h2 id="themeTitle">Giao diện</h2><button type="button" data-close="themeSheet" aria-label="Đóng">×</button></header><label class="theme-choice"><input type="radio" name="theme" value="system"> Theo hệ thống</label><label class="theme-choice"><input type="radio" name="theme" value="light"> Sáng</label><label class="theme-choice"><input type="radio" name="theme" value="dark"> Tối</label></form></dialog>
  <dialog id="categorySheet" class="sheet wide-sheet" aria-labelledby="categoryTitle"><section><header><h2 id="categoryTitle">Quản lý danh mục</h2><button type="button" data-close="categorySheet" aria-label="Đóng">×</button></header><ol id="categoryManagerList" class="category-manager-list"></ol><button id="addCategoryButton" type="button">Thêm danh mục</button></section></dialog>
  <dialog id="categoryEditor" class="sheet" aria-labelledby="categoryEditorTitle"><form id="categoryForm"><header><h2 id="categoryEditorTitle">Danh mục</h2><button type="button" data-close="categoryEditor" aria-label="Đóng">×</button></header><input id="categoryId" type="hidden"><label for="categoryName">Tên</label><input id="categoryName" maxlength="40"><p id="categoryNameError" class="field-error" role="alert"></p><label for="categoryEmoji">Biểu tượng</label><input id="categoryEmoji" maxlength="8"><label for="categoryColor">Màu</label><input id="categoryColor" type="color"><button class="primary-button" type="submit">Lưu danh mục</button></form></dialog>
  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle"><form method="dialog"><h2 id="confirmTitle">Xác nhận</h2><p id="confirmMessage"></p><div class="button-row"><button value="cancel">Hủy</button><button id="confirmAction" class="danger-button" value="confirm">Xóa</button></div></form></dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
